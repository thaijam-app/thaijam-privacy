<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="ThaiJam 泰記的隱私權政策。">
  <title>ThaiJam 泰記｜隱私權政策</title>
  <style>
    :root { color-scheme: light dark; }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      font-family: -apple-system, BlinkMacSystemFont, "PingFang TC", "Noto Sans TC", sans-serif;
      background: #fff8f2;
      color: #2e211b;
    }
    main { width: min(100%, 640px); }
    .card {
      padding: 42px;
      border: 1px solid #f0d9c8;
      border-radius: 24px;
      background: #fff;
      box-shadow: 0 16px 50px rgb(92 48 20 / 10%);
    }
    .eyebrow { margin: 0 0 12px; color: #b04c13; font-weight: 650; letter-spacing: .04em; }
    h1 { margin: 0; font-size: clamp(2rem, 7vw, 3rem); letter-spacing: -.04em; }
    p { line-height: 1.75; font-size: 1.05rem; }
    a {
      display: inline-block;
      margin-top: 12px;
      padding: 13px 20px;
      border-radius: 999px;
      background: #c55b1c;
      color: #fff;
      font-weight: 700;
      text-decoration: none;
    }
    a:hover { background: #9e430f; }
    footer { padding: 22px 4px 0; color: #755f53; font-size: .9rem; text-align: center; }
    @media (prefers-color-scheme: dark) {
      body { background: #1f1713; color: #f9eee7; }
      .card { border-color: #4e3527; background: #2a1e18; box-shadow: none; }
      .eyebrow { color: #ffad74; }
      footer { color: #c8ada0; }
    }
    @media (max-width: 480px) { .card { padding: 30px 24px; } }
  </style>
</head>
<body>
  <main>
    <section class="card">
      <p class="eyebrow">ThaiJam 泰記</p>
      <h1>隱私權政策</h1>
      <p>我們不出售、分享或用於廣告追蹤你的個人資料。學習資料保留在你的裝置；如啟用 iCloud 同步，資料僅同步至你自己的 iCloud 私人資料庫。</p>
      <a href="privacy-policy.html">閱讀完整隱私權政策</a>
    </section>
    <footer>© ThaiJam 泰記</footer>
  </main>
</body>
</html>
